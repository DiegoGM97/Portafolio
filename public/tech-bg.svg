<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" class="tech-grid-bg">
  <defs>
    <pattern id="tech-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(59, 130, 246, 0.08)" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="60%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.15)"/>
      <stop offset="50%" stop-color="rgba(6, 182, 212, 0.05)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="corner-glow-tl" cx="0%" cy="0%" r="50%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="corner-glow-br" cx="100%" cy="100%" r="50%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow-blur">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#center-glow)"/>
  <rect width="100%" height="100%" fill="url(#corner-glow-tl)"/>
  <rect width="100%" height="100%" fill="url(#corner-glow-br)"/>
  <rect width="100%" height="100%" fill="url(#tech-grid)"/>

  <g class="floating-elements" opacity="0.6">
    <circle cx="10%" cy="20%" r="2" fill="rgba(6, 182, 212, 0.8)" filter="url(#glow-blur)">
      <animate attributeName="cy" values="20%;18%;20%" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85%" cy="15%" r="1.5" fill="rgba(59, 130, 246, 0.8)" filter="url(#glow-blur)">
      <animate attributeName="cy" values="15%;12%;15%" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70%" cy="80%" r="2.5" fill="rgba(6, 182, 212, 0.6)" filter="url(#glow-blur)">
      <animate attributeName="cy" values="80%;78%;80%" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20%" cy="75%" r="1.5" fill="rgba(59, 130, 246, 0.7)" filter="url(#glow-blur)">
      <animate attributeName="cy" values="75%;72%;75%" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50%" cy="90%" r="1" fill="rgba(96, 165, 250, 0.8)" filter="url(#glow-blur)">
      <animate attributeName="cy" values="90%;88%;90%" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="connection-lines" stroke="rgba(59, 130, 246, 0.2)" stroke-width="0.5" fill="none" opacity="0.4">
    <path d="M 10% 20% L 30% 35% L 50% 25%">
      <animate attributeName="stroke-opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 85% 15% L 70% 40% L 90% 60%">
      <animate attributeName="stroke-opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 20% 75% L 40% 60% L 60% 80%">
      <animate attributeName="stroke-opacity" values="0.2;0.3;0.2" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g class="hexagon-grid" fill="none" stroke="rgba(59, 130, 246, 0.06)" stroke-width="0.5" opacity="0.5">
    <polygon points="15%,10% 18%,12% 18%,16% 15%,18% 12%,16% 12%,12%">
      <animate attributeName="stroke-opacity" values="0.06;0.12;0.06" dur="6s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="80%,30% 83%,32% 83%,36% 80%,38% 77%,36% 77%,32%">
      <animate attributeName="stroke-opacity" values="0.05;0.1;0.05" dur="7s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="60%,70% 63%,72% 63%,76% 60%,78% 57%,76% 57%,72%">
      <animate attributeName="stroke-opacity" values="0.04;0.08;0.04" dur="5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="25%,55% 28%,57% 28%,61% 25%,63% 22%,61% 22%,57%">
      <animate attributeName="stroke-opacity" values="0.06;0.1;0.06" dur="6.5s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>